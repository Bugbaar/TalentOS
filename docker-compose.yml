services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/talentos.db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SEED_ON_STARTUP: "true"
    volumes:
      - talentos-data:/data

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  talentos-data:
